# Local PostgreSQL 16 for StudioDesk. App servers run on the host, not in Docker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studiodesk
      POSTGRES_PASSWORD: studiodesk
      POSTGRES_DB: studiodesk
    ports:
      - "5432:5432"
    volumes:
      - studiodesk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiodesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studiodesk_pg:
